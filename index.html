<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASST — Fortuna Pelatihan Teknik Sablon & Tekstil</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap');

        :root {
            --navy: #14273f;
            --light: #f8f9fa;
            --black: #000000;
            --white: #ffffff;
            --soft-gray: #dfe3e8;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--black);
            color: var(--white);
        }
        .page {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            background-color: var(--black);
            min-height: 100vh;
            box-sizing: border-box;
        }

        .navbar {
            width: 100%;
            background-color: rgba(20, 39, 63, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .nav-list {
            max-width: 1000px;
            margin: 0 auto;
            padding: 16px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            list-style: none;
            flex-wrap: wrap;
        }

        .nav-list a {
            color: var(--white);
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 0.03em;
            transition: opacity 0.2s ease;
        }

        .nav-list a:hover {
            opacity: 0.75;
        }

        .logo {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 16px 10px;
            box-sizing: border-box;
        }

        .logo img {
            display: block;
            max-width: 100%;
            height: auto;
            width: clamp(180px, 40vw, 360px);
        }

        .band {
            text-align: center;
            padding: 20px 16px 40px;
        }

        .band h1 {
            margin: 0 0 10px;
            color: var(--white);
            font-size: clamp(1.8rem, 4vw, 3rem);
        }

        .band p {
            margin: 0;
            color: var(--soft-gray);
            font-size: clamp(0.95rem, 2vw, 1.2rem);
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="logo">
            <img src="Asset/logo.png" alt="Header Image" />
        </div>
        <div class="band">
            <h1>Selamat Datang di FASST</h1>
            <p>Fortuna Pelatihan Teknik Sablon & Tekstil</p>
        </div>
    </div>
</body>
</html>
